<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hive viewer</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      body.cover #stage { object-fit: cover; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <video id="stage" autoplay muted playsinline hidden></video>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
