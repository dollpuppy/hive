<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hive viewer</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      #stage, #alpha { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      body.cover #stage, body.cover #alpha { object-fit: cover; }
      #stage.feeder { inset: auto; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <video id="stage" autoplay muted playsinline hidden></video>
    <canvas id="alpha" hidden></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
